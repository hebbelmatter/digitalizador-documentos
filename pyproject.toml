[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalizador-documentos"
version = "0.1.0"
description = "Digitaliza documentos en local: limpieza de imagen, OCR en español, PDF buscable y extracción de datos (RUT, nombre, fechas)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "Pillow>=10.0",
  "pytesseract>=0.3.10",
  "pypdf>=4.0",
  "PyMuPDF>=1.23",
  "Flask>=3.0",
  "pillow-heif>=0.16",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "python-calamine>=0.2",
  "python-dateutil>=2.8",
  "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
digitalizar = "digitalizador.cli:main"
controles = "controles.cli:main"

[tool.setuptools]
packages = ["digitalizador", "controles"]
